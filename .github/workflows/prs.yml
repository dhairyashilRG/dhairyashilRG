name: refresh upstream list

on:
  schedule:
    - cron: "47 3 * * *"   # nightly, after the site's own refresh at 02:17 UTC has deployed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_prs.py
      - name: commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "readme-bot"
            git config user.email "readme-bot@users.noreply.github.com"
            git commit -am "Refresh upstream list ($(date -u +%F))"
            git push
          fi
